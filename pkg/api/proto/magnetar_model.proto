syntax = "proto3";

option go_package="github.com/c12s/magnetar/pkg/api";
package proto;

message Node {
  string id = 1;
  string org = 2;
  repeated Label labels = 3;
  map<string, double> resources = 4;
  string bindAddress = 5;
  repeated string capabilities = 6;
  OsStatus osStatus = 7;
  DesiredOsImage desiredOsImage = 8;
  repeated DesiredVm desiredVms = 9;
  repeated VmStatus vmStatus = 10;
}

message OsStatus {
  string bootedImage = 1;
  string bootedDigest = 2;
  string bootedVersion = 3;
  string phase = 4;
  OsAttempt lastAttempt = 5;
  // the other deployment on disk (bootc's rollback entry); target of
  // `image rollback`. After a greenboot rollback it is the rejected image.
  string rollbackImage = 6;
  string rollbackDigest = 7;
}

message OsAttempt {
  string image = 1;
  string digest = 2;
  string result = 3;
  int64 timestamp = 4;
}

message DesiredOsImage {
  string imageRef = 1;
  string digest = 2;
  string rebootPolicy = 3;
}

message DesiredVm {
  string name = 1;
  string qcow2Url = 2;
  string digest = 3;
  uint32 vcpus = 4;
  uint32 memoryMb = 5;
  repeated Label labels = 6;
}

message VmStatus {
  string name = 1;
  string state = 2;
  string bootedOs = 3;
}

message Label {
  string key = 1;
  Value value = 2;
}

message BoolLabel {
  string key = 1;
  bool value = 2;
}

message Float64Label {
  string key = 1;
  double value = 2;
}

message StringLabel {
  string key = 1;
  string value = 2;
}

message Value {
  enum ValueTYpe {
    Bool = 0;
    Float64 = 1;
    String = 2;
  };
  ValueTYpe type = 1;
  bytes marshalled = 2;
}

message BoolValue {
  bool value = 1;
}

message Float64Value {
  double value = 1;
}

message StringValue {
  string value = 1;
}

message NodeStringified {
  string id = 1;
  string org = 2;
  repeated LabelStringified labels = 3;
  map<string, double> resources = 4;
  repeated string capabilities = 5;
  OsStatus osStatus = 6;
  DesiredOsImage desiredOsImage = 7;
  // Liveness view, filled on read and never stored on the node record:
  // lastSeen is unix seconds of the last heartbeat/update (0 = never seen,
  // e.g. a record from before heartbeats existed); liveness is
  // online | stale | offline | unknown, computed from lastSeen.
  int64 lastSeen = 8;
  string liveness = 9;
}

message LabelStringified {
  string key = 1;
  string value = 2;
}